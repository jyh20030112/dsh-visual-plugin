<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" viewBox="0 0 720 420">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#0e1a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect width="720" height="420" fill="url(#bg)" rx="20"/>

  <!-- window chrome -->
  <rect width="720" height="46" x="0" y="0" fill="#111c30" rx="20"/>
  <rect width="720" height="16" x="0" y="30" fill="#111c30"/>
  <circle cx="22" cy="23" r="5" fill="#f87171"/>
  <circle cx="38" cy="23" r="5" fill="#fbbf24"/>
  <circle cx="54" cy="23" r="5" fill="#34d399"/>
  <text x="600" y="28" fill="#64748b" font-size="13" text-anchor="end">dsh web — session · vision bridge</text>
  <rect width="720" height="3" x="0" y="46" fill="url(#accent)" opacity=".7"/>

  <!-- ======================= chat column ======================= -->

  <!-- you: image + question -->
  <text x="40" y="92" fill="#94a3b8" font-size="14">you</text>
  <rect width="360" height="44" x="40" y="100" fill="#1e293b" rx="10"/>
  <rect width="24" height="24" x="52" y="110" rx="6" fill="#0f1b2e" stroke="#334155"/>
  <circle cx="60" cy="118" r="2" fill="#38bdf8"/>
  <path d="M54 130 L60 123 L64 126 L70 119 L74 130 Z" fill="#64748b"/>
  <text x="88" y="127" fill="#e2e8f0" font-size="13">What's in this image?</text>

  <!-- vision bridge: describing (settles in place) -->
  <g>
    <animate attributeName="opacity" dur="7s" keyTimes="0;0.16;0.20;0.88;0.92;1" repeatCount="indefinite" values="0;0;1;1;0;0"/>
    <text x="40" y="188" fill="#38bdf8" font-size="14">vision bridge</text>
  </g>
  <g>
    <animate attributeName="opacity" dur="7s" keyTimes="0;0.18;0.22;0.36;0.40;1" repeatCount="indefinite" values="0;0;1;1;0;0"/>
    <rect width="230" height="40" x="40" y="196" fill="#0f1b2e" stroke="#23324a" rx="10"/>
    <circle cx="68" cy="216" r="4" fill="#64748b"><animate attributeName="opacity" dur="0.9s" repeatCount="indefinite" values="0.3;1;0.3"/></circle>
    <circle cx="86" cy="216" r="4" fill="#64748b"><animate attributeName="opacity" begin="0.3s" dur="0.9s" repeatCount="indefinite" values="0.3;1;0.3"/></circle>
    <circle cx="104" cy="216" r="4" fill="#64748b"><animate attributeName="opacity" begin="0.6s" dur="0.9s" repeatCount="indefinite" values="0.3;1;0.3"/></circle>
    <text x="120" y="221" fill="#94a3b8" font-size="13">describing image…</text>
  </g>
  <g>
    <animate attributeName="opacity" dur="7s" keyTimes="0;0.38;0.42;0.88;0.92;1" repeatCount="indefinite" values="0;0;1;1;0;0"/>
    <rect width="396" height="64" x="40" y="196" fill="#0b1c3a" stroke="#818cf8" stroke-width="1.5" rx="10"/>
    <circle cx="64" cy="210" r="7" fill="#34d399"/>
    <path d="M60.5 210 l2.5 2.5 L68 207" stroke="#0b1c3a" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="82" y="211" fill="#818cf8" font-size="12">vision_bridge · auto-describe</text>
    <text x="82" y="232" fill="#e0e7ff" font-size="13">A red apple on a wooden table,</text>
    <text x="82" y="250" fill="#e0e7ff" font-size="13">labeled “Fresh”.</text>
  </g>

  <!-- agent: answer derived from the description -->
  <g>
    <animate attributeName="opacity" dur="7s" keyTimes="0;0.56;0.60;0.88;0.92;1" repeatCount="indefinite" values="0;0;1;1;0;0"/>
    <text x="40" y="296" fill="#94a3b8" font-size="14">agent</text>
    <rect width="396" height="52" x="40" y="304" fill="#0f1b2e" stroke="#23324a" rx="10"/>
    <text x="52" y="326" fill="#e2e8f0" font-size="13">It's a red apple on a wooden table, with the</text>
    <text x="52" y="344" fill="#e2e8f0" font-size="13">word “Fresh” printed on it.</text>
  </g>

  <!-- ======================= right panel ======================= -->

  <line x1="452" y1="60" x2="452" y2="400" stroke="#1e293b" stroke-width="1"/>

  <text x="464" y="92" fill="#94a3b8" font-size="14">vision bridge</text>
  <text x="700" y="92" fill="#64748b" font-size="16" text-anchor="middle">×</text>

  <text x="464" y="114" fill="#38bdf8" font-size="12">recent</text>
  <rect width="34" height="2" x="464" y="118" fill="url(#accent)"/>

  <g>
    <animate attributeName="opacity" dur="7s" keyTimes="0;0.46;0.50;0.88;0.92;1" repeatCount="indefinite" values="0;0;1;1;0;0"/>
    <rect width="240" height="96" x="464" y="128" fill="#0f1b2e" stroke="#23324a" rx="10"/>
    <rect width="44" height="44" x="476" y="140" rx="8" fill="#1e293b" stroke="#334155"/>
    <circle cx="498" cy="162" r="10" fill="#f87171"/>
    <circle cx="494" cy="158" r="2.5" fill="#fca5a5"/>
    <path d="M498 152 q0 -5 2 -8" stroke="#7c2d12" stroke-width="2" fill="none"/>
    <ellipse cx="504" cy="145" rx="4.5" ry="2.5" fill="#34d399" transform="rotate(-25 504 145)"/>
    <text x="532" y="152" fill="#818cf8" font-size="11">auto-describe</text>
    <text x="532" y="172" fill="#e2e8f0" font-size="12">A red apple on a</text>
    <text x="532" y="188" fill="#e2e8f0" font-size="12">wooden table.</text>
    <text x="532" y="208" fill="#64748b" font-size="11">just now</text>
  </g>

  <!-- footer -->
  <rect width="720" height="18" x="0" y="402" fill="#0d1524"/>
  <text x="360" y="414" fill="#475569" font-size="11" text-anchor="middle">image → vision model → [Vision description] → main model — looped demo</text>
</svg>
