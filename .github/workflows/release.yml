name: release

# CD：打 vX.Y.Z tag（或手动指定）时——
#   1) 校验 tag 与 package.json version 一致
#   2) npm pack 出 tarball（使用提交的预构建 lib/，无需在 CI 重建）
#   3) 创建 GitHub Release 并附带 tarball
#   4) npm publish 到官方 registry（dsh 的官方插件分发渠道：
#      用户经 `dsh plugin --profile <name> add dsh-visual-plugin` 安装）
#
# 首次使用：在仓库 Settings → Secrets and variables → Actions 添加
#   NPM_TOKEN（npmjs.com 的自动化 token，需有 publish 权限）。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（vX.Y.Z，需已推送到本仓库）'
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Checkout compatible DeepSeek Harness
        uses: actions/checkout@v4
        with:
          repository: jyh20030112/deepseek-harness
          ref: 99f6f02fecdb7dff40c3fbc9470f5907c29f74ca
          path: deepseek-harness

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: deepseek-harness/pnpm-lock.yaml

      - name: 安装 Harness 与视频依赖
        run: |
          pnpm --dir deepseek-harness install --frozen-lockfile
          python -m pip install 'scenedetect[opencv]>=0.7.1,<0.8'
          scenedetect version

      - name: 解析并校验版本（tag == package.json version）
        id: ver
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          [ "$TAG" = "$GITHUB_REF" ] && TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then echo "未提供 tag"; exit 1; fi
          V=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$V" ]; then
            echo "tag($TAG) 与 package.json version(v$V) 不一致"; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          case "$V" in
            *-*) echo "dist_tag=beta" >> "$GITHUB_OUTPUT"; echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "dist_tag=latest" >> "$GITHUB_OUTPUT"; echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: 测试、类型检查并校验预构建产物
        env:
          HARNESS: ${{ github.workspace }}/deepseek-harness
        run: |
          npm run bootstrap
          npm test
          npm run typecheck
          npm run build
          git diff --exit-code -- lib/

      - name: 校验提交的预构建产物
        run: |
          test -f lib/index.js
          test -f lib/invariant.js
          test -f lib/client.js
          test -f lib/types/video/types.d.ts
          test -f cordis.patch.yml

      - name: npm pack
        run: npm pack

      - name: 创建/更新 GitHub Release 并上传 tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TGZ=$(ls dsh-visual-plugin-*.tgz | head -1)
          TAG="${{ steps.ver.outputs.tag }}"
          if gh release view "$TAG" --json tagName >/dev/null 2>&1; then
            gh release upload "$TAG" "$TGZ" --clobber
          else
            EXTRA=()
            if [ "${{ steps.ver.outputs.prerelease }}" = "true" ]; then EXTRA+=(--prerelease); fi
            gh release create "$TAG" "$TGZ" \
              --title "dsh-visual-plugin ${{ steps.ver.outputs.tag }}" \
              --generate-notes "${EXTRA[@]}"
          fi
          echo "GitHub Release: $TAG ($TGZ)"

      - name: 发布到 npm（官方插件分发渠道）
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --tag "${{ steps.ver.outputs.dist_tag }}"
